site_name: Kubernetes Homelab
site_description: Bare-metal Kubernetes homelab operating across dual-node Proxmox VE hardware.
site_author: Victoria Cheng
repo_url: https://github.com/victoriacheng15/kubernetes-homelab
repo_name: victoriacheng15/kubernetes-homelab

theme:
  name: material
  language: en
  palette:
    # Dark mode (default): dark grey with vibrant orange accents
    - scheme: slate
      primary: grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: README.md
  - Architecture: architecture.md
  - Operations & GitOps: operations.md
  - Observability & Security: platform.md
  - ADRs: adr/README.md
