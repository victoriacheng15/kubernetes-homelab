apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.19.2/install.yaml
  - cluster-policies.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      namespace: kyverno
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/telemetry: "true"
