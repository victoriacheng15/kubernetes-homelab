apiVersion: v1
kind: Namespace
metadata:
  name: falco
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
  - kind: ServiceAccount
    name: falco
    namespace: falco
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: falco
data:
  homelab.yaml: |
    engine:
      kind: modern_ebpf
    load_plugins: [container]
    plugins:
      - name: container
        library_path: libcontainer.so
        init_config:
          engines:
            containerd:
              enabled: true
              sockets:
                - /run/k3s/containerd/containerd.sock
    stdout_output:
      enabled: true
    priority: notice
    buffered_outputs: false
    container_engines:
      cri:
        enabled: true
        sockets:
          - /run/k3s/containerd/containerd.sock
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/name: falco
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
    spec:
      serviceAccountName: falco
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: falco
          image: docker.io/falcosecurity/falco:0.45.2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            privileged: true
          args:
            - /usr/bin/falco
          volumeMounts:
            - mountPath: /etc/falco/config.d/homelab.yaml
              name: falco-config
              subPath: homelab.yaml
            - mountPath: /host/proc
              name: proc-fs
              readOnly: true
            - mountPath: /host/etc
              name: etc-fs
              readOnly: true
            - mountPath: /host/dev
              name: dev-fs
              readOnly: false
            - mountPath: /sys/kernel
              name: sys-kernel
              readOnly: true
            - mountPath: /run/k3s/containerd/containerd.sock
              name: containerd-socket
              readOnly: true
      volumes:
        - name: falco-config
          configMap:
            name: falco-config
        - name: proc-fs
          hostPath:
            path: /proc
        - name: etc-fs
          hostPath:
            path: /etc
        - name: dev-fs
          hostPath:
            path: /dev
        - name: sys-kernel
          hostPath:
            path: /sys/kernel
        - name: containerd-socket
          hostPath:
            path: /run/k3s/containerd/containerd.sock
