---
# ==============================================================================
# Playbook: setup-vms.yml
# Purpose: Configures fresh Ubuntu 24.04 VMs for container & Kubernetes workloads.
# Target: Runs against all provisioned nodes in the [nodes] inventory group.
# ==============================================================================

- name: Setup Fresh Ubuntu VMs
  hosts: nodes
  become: true
  tasks:
    - name: Ensure timezone is locked strictly to UTC
      community.general.timezone:
        name: UTC

    - name: Disable active swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Disable swap entry permanently in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboot in /etc/modules-load.d/k8s.conf
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Apply sysctl network parameters for bridging and IP forwarding
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        reload: true
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Install essential system and diagnostic packages
      apt:
        name:
          - curl
          - git
          - jq
          - tcpdump
          - socat
          - chrony
          - htop
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600
