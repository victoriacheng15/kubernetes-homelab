---
# ==============================================================================
# Playbook: setup-nginx.yml
# Purpose: Configures Nginx reverse proxy on CT 302 for homelab dashboards.
# Target: Runs against the [gateway] inventory group.
# ==============================================================================

- name: Setup Nginx Ingress Gateway
  hosts: gateway
  become: true
  vars:
    k8s_control_plane_ip: "{{ hostvars['k8s-cp-01']['ansible_host'] }}"

  tasks:
    - name: Install Nginx web server
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Remove default Nginx welcome page
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Configure ArgoCD reverse proxy virtual host
      copy:
        dest: /etc/nginx/conf.d/argocd.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name argocd.homelab.local;

              location / {
                  proxy_pass https://{{ k8s_control_plane_ip }}:30443;
                  proxy_ssl_verify off;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # WebSocket support
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
      notify: Reload Nginx

    - name: Configure Hubble UI reverse proxy virtual host
      copy:
        dest: /etc/nginx/conf.d/hubble.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name hubble.homelab.local;

              location / {
                  proxy_pass http://{{ k8s_control_plane_ip }}:31235;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # WebSocket support
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
      notify: Reload Nginx

    - name: Ensure Nginx service is running and enabled
      systemd:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
