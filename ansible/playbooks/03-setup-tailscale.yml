---
# ==============================================================================
# Playbook: 03-setup-tailscale.yml
# Purpose: Configures Tailscale VPN subnet router on CT 301 for remote homelab access.
# Target: Runs against the [vpn] inventory group.
# ==============================================================================

- name: Setup Tailscale Subnet Router Gateway
  hosts: vpn
  become: true

  tasks:
    - name: Enable IPv4 and IPv6 packet forwarding
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true
      loop:
        - { key: 'net.ipv4.ip_forward', value: '1' }
        - { key: 'net.ipv6.conf.all.forwarding', value: '1' }

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - iptables
          - ca-certificates
        state: present
        update_cache: true

    - name: Download and execute Tailscale official installer
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Ensure tailscaled systemd service is enabled and started
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true
