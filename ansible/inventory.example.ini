# ==============================================================================
# Ansible Inventory for Fresh Proxmox VMs
# Copy this file to inventory.ini and replace placeholders with node IPs or DNS names.
# ==============================================================================

# ------------------------------------------------------------------------------
# Kubernetes Nodes (Layer 3 Infrastructure)
# ------------------------------------------------------------------------------

[control_plane]
k8s-cp-01        ansible_host=<CP_IP>

[workers]
k8s-telemetry-01 ansible_host=<TELEMETRY_IP> node_role=telemetry
k8s-app-01       ansible_host=<APP_IP>       node_role=app

[nodes:children]
control_plane
workers

[nodes:vars]
ansible_user=ubuntu

# ------------------------------------------------------------------------------
# Standalone Utility Containers (Layer 2 Services - Debian LXC)
# ------------------------------------------------------------------------------

[dns]
pihole           ansible_host=<PIHOLE_IP>

[gateway]
nginx            ansible_host=<NGINX_IP>

[nas]
storage          ansible_host=<STORAGE_IP>

[utilities:children]
dns
gateway
nas

[utilities:vars]
ansible_user=root

# ------------------------------------------------------------------------------
# Physical Infrastructure (Layer 0 Tiebreaker)
# ------------------------------------------------------------------------------

[pi]
rpi-01           ansible_host=<RPI_IP>

[pi:vars]
ansible_user=pi

# ------------------------------------------------------------------------------
# Ephemeral Sandbox (Testing & Staging)
# ------------------------------------------------------------------------------

[sandbox]
# sandbox-vm-01    ansible_host=10.0.0.90
# sandbox-ct-01    ansible_host=10.0.0.80 ansible_user=root

[sandbox:vars]
ansible_user=ubuntu

