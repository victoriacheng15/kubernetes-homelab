name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.changes.outputs.markdown }}
      opentofu: ${{ steps.changes.outputs.opentofu }}
      ansible: ${{ steps.changes.outputs.ansible }}
      gitops: ${{ steps.changes.outputs.gitops }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint*'
            opentofu:
              - 'infra/**'
            ansible:
              - 'ansible/**'
            gitops:
              - 'gitops/**'

  lint-md:
    name: Lint Markdown
    needs: filter
    if: ${{ needs.filter.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run markdown lint
        run: make lint-md

  lint-yaml:
    name: Lint YAML
    needs: filter
    if: ${{ needs.filter.outputs.ansible == 'true' || needs.filter.outputs.gitops == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run yamllint
        run: uvx yamllint -d relaxed ansible/ gitops/

  validate-tofu:
    name: Validate OpenTofu
    needs: filter
    if: ${{ needs.filter.outputs.opentofu == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Check Formatting
        working-directory: infra
        run: tofu fmt -check

      - name: Initialize Providers
        working-directory: infra
        run: tofu init -backend=false

      - name: Validate Configuration
        working-directory: infra
        run: tofu validate

  validate-ansible:
    name: Validate Ansible
    needs: filter
    if: ${{ needs.filter.outputs.ansible == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Ansible Collections
        run: uvx --from ansible-core ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check Playbook Syntax
        run: uvx --from ansible-core ansible-playbook --syntax-check ansible/playbooks/*.yml -i ansible/inventory.example.ini
